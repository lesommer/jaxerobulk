[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxerobulk"
version = "0.1.0"
description = "Differentiable aerodynamic bulk formulae for air-sea fluxes, in JAX/Equinox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist",
]

[project.scripts]
aerobulk-toy = "jaxerobulk.cli:aerobulk_toy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxerobulk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
